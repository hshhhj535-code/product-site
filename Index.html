<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Replica Finder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #888;
      margin-top: 6px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      flex-wrap: wrap;
    }

    button {
      background: #181818;
      color: white;
      border: 1px solid #333;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #252525;
    }

    .search {
      display: block;
      width: 90%;
      max-width: 600px;
      margin: 10px auto 25px;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #151515;
      color: white;
      font-size: 16px;
    }

    #products {
      width: 92%;
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding-bottom: 50px;
    }

    .card {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: #1b1b1b;
    }

    .no-image {
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .info {
      padding: 15px;
    }

    .brand {
      color: #999;
      font-size: 13px;
    }

    .name {
      font-size: 18px;
      margin: 6px 0;
    }

    .seller {
      color: #bbb;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #222;
      font-size: 12px;
    }

    .available {
      color: #6ee7a0;
    }

    .unavailable {
      color: #ff7777;
    }

    .view {
      display: block;
      margin-top: 14px;
      text-align: center;
      padding: 10px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }

    #loading,
    #error,
    #empty {
      text-align: center;
      color: #888;
      padding: 40px;
    }
  </style>
</head>

<body>

<header>
  <h1>Replica Finder</h1>
  <div class="subtitle">Find the best sellers & budget finds</div>
</header>

<nav>
  <button onclick="setCategory('ALL')">All</button>
  <button onclick="setCategory('Best Sellers')">Best Sellers</button>
  <button onclick="setCategory('Budget')">Budget</button>
  <button onclick="setBrand('Chrome Hearts')">Chrome Hearts</button>
</nav>

<input
  id="search"
  class="search"
  type="text"
  placeholder="Search products..."
  oninput="renderProducts()"
>

<div id="loading">Loading products...</div>

<div id="error" style="display:none;">
  Could not load products.
</div>

<div id="empty" style="display:none;">
  No products found.
</div>

<div id="products"></div>

<script>

const API_URL =
  "https://soft-firefly-59b3.hshhhj535.workers.dev/api/products";

let allProducts = [];
let currentCategory = "ALL";
let currentBrand = "ALL";

async function loadProducts() {

  try {

    const response = await fetch(API_URL);

    if (!response.ok) {
      throw new Error("API error");
    }

    allProducts = await response.json();

    document.getElementById("loading").style.display = "none";

    renderProducts();

  } catch (error) {

    console.error(error);

    document.getElementById("loading").style.display = "none";
    document.getElementById("error").style.display = "block";

  }

}

function setCategory(category) {

  currentCategory = category;

  renderProducts();

}

function setBrand(brand) {

  currentBrand = brand;

  renderProducts();

}

function renderProducts() {

  const container = document.getElementById("products");
  const search = document
    .getElementById("search")
    .value
    .toLowerCase();

  container.innerHTML = "";

  const filtered = allProducts.filter(product => {

    const matchesCategory =
      currentCategory === "ALL" ||
      product.category === currentCategory;

    const matchesBrand =
      currentBrand === "ALL" ||
      product.brand === currentBrand;

    const matchesSearch =
      !search ||
      (product.name || "").toLowerCase().includes(search) ||
      (product.brand || "").toLowerCase().includes(search) ||
      (product.seller_name || "").toLowerCase().includes(search);

    return matchesCategory &&
           matchesBrand &&
           matchesSearch;

  });

  document.getElementById("empty").style.display =
    filtered.length === 0 ? "block" : "none";

  filtered.forEach(product => {

    const card = document.createElement("div");

    card.className = "card";

    const image = product.image_url
      ? `<img class="product-image" src="${product.image_url}" alt="">`
      : `<div class="no-image">No image yet</div>`;

    const availabilityClass =
      product.availability === "AVAILABLE"
        ? "available"
        : "unavailable";

    card.innerHTML = `

      ${image}

      <div class="info">

        <div class="brand">
          ${product.brand || ""}
        </div>

        <div class="name">
          ${product.name || "Unnamed Product"}
        </div>

        <div class="seller">
          Seller: ${product.seller_name || "Unknown"}
        </div>

        <div class="badge">
          ${product.seller_tier || ""}
        </div>

        <div class="badge ${availabilityClass}">
          ${product.availability || "UNKNOWN"}
        </div>

        <a
          class="view"
          href="${product.product_url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          View Product
        </a>

      </div>

    `;

    container.appendChild(card);

  });

}

loadProducts();

</script>

</body>
</html>
