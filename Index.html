<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replica Finder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #fff;
    }

    header {
      padding: 22px 5%;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(11,11,11,0.95);
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 22px;
      font-size: 14px;
    }

    nav a:hover {
      color: white;
    }

    .hero {
      padding: 70px 5% 45px;
      max-width: 1200px;
      margin: auto;
    }

    .hero h1 {
      font-size: clamp(38px, 7vw, 72px);
      line-height: 0.95;
      letter-spacing: -3px;
      max-width: 750px;
    }

    .hero p {
      color: #999;
      margin-top: 22px;
      font-size: 16px;
      max-width: 600px;
      line-height: 1.6;
    }

    .search {
      margin-top: 30px;
      width: 100%;
      max-width: 600px;
      padding: 16px 18px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 10px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .section {
      padding: 25px 5% 70px;
      max-width: 1300px;
      margin: auto;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .filter {
      padding: 9px 15px;
      border-radius: 999px;
      border: 1px solid #333;
      background: #141414;
      color: #bbb;
      cursor: pointer;
    }

    .filter.active,
    .filter:hover {
      background: white;
      color: black;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .card {
      background: #121212;
      border: 1px solid #222;
      border-radius: 14px;
      overflow: hidden;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #444;
    }

    .card-image {
      height: 260px;
      background: #1b1b1b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
    }

    .card-content {
      padding: 17px;
    }

    .brand {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .name {
      font-size: 17px;
      font-weight: 700;
      margin-top: 7px;
    }

    .seller {
      color: #aaa;
      margin-top: 8px;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      margin-top: 12px;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 5px;
      background: #17351f;
      color: #75d98d;
    }

    .button {
      display: block;
      text-align: center;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    footer {
      border-top: 1px solid #222;
      padding: 30px 5%;
      color: #666;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 5%;
      }

      nav {
        display: none;
      }

      .hero {
        padding-top: 50px;
      }

      .card-image {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">FINDER</div>

  <nav>
    <a href="#">Home</a>
    <a href="#best">Best Sellers</a>
    <a href="#budget">Budget</a>
  </nav>
</header>

<section class="hero">
  <h1>Find the best sellers.</h1>

  <p>
    A simple directory for discovering products, sellers and updated source links.
  </p>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Search products, brands or sellers..."
  >
</section>

<section class="section" id="best">

  <h2 class="section-title">Best Sellers</h2>

  <div class="filters">
    <button class="filter active" onclick="filterProducts('all', this)">All</button>
    <button class="filter" onclick="filterProducts('Chrome Hearts', this)">Chrome Hearts</button>
  </div>

  <div id="products" class="grid"></div>

</section>

<footer>
  Product links are provided for reference. Always verify availability before purchasing.
</footer>

<script>

const products = [

  {
    name: "Chrome Hearts Product 01",
    brand: "Chrome Hearts",
    seller: "TopHotFashion",
    tier: "Best Seller",
    status: "Available",
    image: "",
    url: "https://tophotfashion.x.yupoo.com/albums/257400405?uid=1&isSubCate=false&referrercate=4644883"
  }

];

let currentFilter = "all";

function displayProducts() {

  const container = document.getElementById("products");
  const search = document.getElementById("search").value.toLowerCase();

  container.innerHTML = "";

  products
    .filter(product => {

      const matchesFilter =
        currentFilter === "all" ||
        product.brand === currentFilter;

      const matchesSearch =
        product.name.toLowerCase().includes(search) ||
        product.brand.toLowerCase().includes(search) ||
        product.seller.toLowerCase().includes(search);

      return matchesFilter && matchesSearch;

    })
    .forEach(product => {

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `

        <div class="card-image">
          ${
            product.image
              ? `<img src="${product.image}" style="width:100%;height:100%;object-fit:cover;">`
              : "Product Image"
          }
        </div>

        <div class="card-content">

          <div class="brand">
            ${product.brand}
          </div>

          <div class="name">
            ${product.name}
          </div>

          <div class="seller">
            Seller: ${product.seller}
          </div>

          <span class="status">
            ${product.status}
          </span>

          <a
            class="button"
            href="${product.url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            View Product
          </a>

        </div>
      `;

      container.appendChild(card);

    });
}

function filterProducts(filter, button) {

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  displayProducts();
}

document
  .getElementById("search")
  .addEventListener("input", displayProducts);

displayProducts();

</script>

</body>
</html>
